# Optional: expose via Ingress instead of a LoadBalancer Service.
# Requires an ingress controller (e.g. `minikube addons enable ingress`).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: heart-disease-api
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: heart-api.local        # add to /etc/hosts -> $(minikube ip)
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: heart-disease-api
                port: { number: 80 }
