# Prometheus scrape config. In docker-compose the API is reachable as "api:8000".
global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: "heart-disease-api"
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]        # service name from docker-compose.yml
        labels:
          service: heart-disease-api

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
