name: CI/CD

# Runs on every push / PR to main. The pipeline fails loudly on any lint,
# test, or training error (assignment production-readiness requirement).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  # ----------------------------------------------------------------------- #
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ruff==0.8.4
      - name: Ruff
        run: ruff check src tests

  # ----------------------------------------------------------------------- #
  test:
    name: Unit tests (pytest)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run tests with coverage
        run: pytest --cov=src --cov-report=xml --cov-report=term --junitxml=pytest-report.xml
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            pytest-report.xml
            coverage.xml

  # ----------------------------------------------------------------------- #
  train:
    name: Train & track model
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Acquire data (falls back to offline fixture if UCI is unreachable)
        run: python -m src.data.download_data || python -m src.data.download_data --synthetic
      - name: Preprocess
        run: python -m src.data.preprocess
      - name: EDA figures
        run: python -m src.eda
      - name: Train + MLflow tracking
        run: python -m src.models.train
      - name: Upload model + metrics + plots + mlruns
        uses: actions/upload-artifact@v4
        with:
          name: model-and-reports
          path: |
            models/
            reports/figures/
            mlruns/

  # ----------------------------------------------------------------------- #
  docker:
    name: Build & smoke-test Docker image
    runs-on: ubuntu-latest
    needs: train
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # Re-create a model so the image has something to serve.
      - run: pip install -r requirements.txt
      - run: |
          python -m src.data.download_data --synthetic
          python -m src.data.preprocess
          python -m src.models.train
      - name: Build image
        run: docker build -t heart-disease-api:ci .
      - name: Run container & hit /health and /predict
        run: |
          docker run -d --name api -p 8000:8000 heart-disease-api:ci
          for i in $(seq 1 15); do
            curl -sf http://localhost:8000/health && break || sleep 2
          done
          curl -sf http://localhost:8000/health
          curl -sf -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"age":63,"sex":1,"cp":3,"trestbps":145,"chol":233,"fbs":1,"restecg":0,"thalach":150,"exang":0,"oldpeak":2.3,"slope":0,"ca":0,"thal":1}'
      - name: Dump container logs (always, for debugging)
        if: always()
        run: docker logs api || true

